name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test and integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install homeassistant $(jq -r '.requirements[]' custom_components/wyze_garmin_sync/manifest.json)

      - name: Run unit tests
        run: python -m unittest discover --start-directory tests --top-level-directory . --verbose
